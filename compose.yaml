services:

  database:

    image: postgres:16

    container_name: nexora-postgres

    environment:

      POSTGRES_DB: nexoradb

      POSTGRES_USER: nexora

      POSTGRES_PASSWORD: nexora_local_password

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        - CMD-SHELL
        - pg_isready -U nexora -d nexoradb

      interval: 5s

      timeout: 5s

      retries: 10


  app:

    build: .

    container_name: nexora-platform

    ports:

      - "18081:8080"

    environment:

      DB_URL: jdbc:postgresql://database:5432/nexoradb

      DB_USER: nexora

      DB_PASSWORD: nexora_local_password

    depends_on:

      database:

        condition: service_healthy


volumes:

  postgres_data: